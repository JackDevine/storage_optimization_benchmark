[project]
name = "storage-optimization-benchmark"
version = "0.1.0"
description = "Benchmark data and models for storage optimization against AEMO NEM market data"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "duckdb>=1.5.6",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "nemosis>=3.8.1",
    "pandas>=2.2.3",
    "pyarrow>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bess", "harness"]
