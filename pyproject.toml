[project]
name = "storage-optimization-benchmark"
version = "0.1.0"
description = "Can an AI agent write a bidding policy for a grid battery? A benchmark on Australian electricity market (NEM) data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack Devine", email = "jack.neville.devine@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "duckdb>=1.5.6",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "pandas>=2.2.3",
    "pyarrow>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bess", "harness"]

[dependency-groups]
notebooks = [
    "altair>=6.3.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "vl-convert-python>=1.9.0.post1",
]
